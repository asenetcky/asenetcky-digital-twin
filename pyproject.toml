[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asenetcky-digital-twin"
version = "0.1.0"
description = "Python Boilerplate contains all the boilerplate you need to create a Python package."
readme = "README.md"
authors = [
  {name = "Alexander J. Senetcky", email = "me@asenetcky.dev"}
]
maintainers = [
  {name = "Alexander J. Senetcky", email = "me@asenetcky.dev"}
]
classifiers = [
    "Typing :: Typed",
    # TODO: Add additional classifiers as needed
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "python-dotenv>=1.2.1",
  "langchain-openai>=1.1.10",
  "langchain-core>=1.2.15",
  "langchain-chroma>=1.1.0",
  "langchain-text-splitters>=1.1.1",
  "langchain>=1.2.10",
  "langchain-community>=0.4.1",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/asenetcky/asenetcky_digital_twin/issues"
changelog = "https://github.com/asenetcky/asenetcky_digital_twin/blob/main/HISTORY.md"
documentation = "https://asenetcky.github.io/asenetcky_digital_twin/"
homepage = "https://github.com/asenetcky/asenetcky_digital_twin"

[project.scripts]
asenetcky_digital_twin = "asenetcky_digital_twin.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
package = true
default-groups = ["dev"]
