[project]
site_name = "asenetcky digital twin"
site_url = "https://asenetcky.github.io/asenetcky_digital_twin/"
repo_url = "https://github.com/asenetcky/asenetcky_digital_twin"
repo_name = "asenetcky/asenetcky_digital_twin"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
